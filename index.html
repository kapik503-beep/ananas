<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trzy święta</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#1b1b24;--panel:#262633;--text:#ececf2;--accent:#9aa5ff;--line:#3a3a4d;--head:#14141b;--headtext:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
body[data-t=halloween]{--bg:#17101f;--panel:#241833;--text:#f2e9f7;--accent:#ff8a1f;--line:#4a2f66;--head:#0d0812;--headtext:#ff8a1f}
body[data-t=grobbing]{--bg:#12161d;--panel:#1c222d;--text:#e6e9ee;--accent:#f2b84b;--line:#323b4a;--head:#0a0d12;--headtext:#f2b84b}
body[data-t=niepodleglosc]{--bg:#fbf6f4;--panel:#ffffff;--text:#2a1518;--accent:#c8102e;--line:#e6d3d3;--head:#c8102e;--headtext:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) body[data-t=niepodleglosc]{--bg:#1d1213;--panel:#2a1a1c;--text:#f6eaea;--accent:#ff5a70;--line:#4d2e32;--head:#9c0d24}}
header{background:var(--head);color:var(--headtext);text-align:center;padding:22px 16px;border-bottom:4px solid var(--accent)}
header h1{margin:0;font-size:2rem;letter-spacing:.05em}
header p{margin:4px 0 0;opacity:.8;font-size:.95rem}
.wrap{flex:1;display:grid;grid-template-columns:210px 1fr 230px;gap:18px;padding:20px;max-width:1100px;width:100%;margin:0 auto}
.wrap.home{grid-template-columns:1fr}
nav,aside,main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
nav h3,aside h3{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
nav a{display:block;padding:6px 8px;border-radius:6px;color:var(--text);text-decoration:none}
nav a:hover{background:var(--line)}
nav a.on{background:var(--accent);color:var(--bg);font-weight:bold}
nav hr{border:0;border-top:1px solid var(--line);margin:12px 0}
main h2{margin-top:0;color:var(--accent)}
aside p{margin:0 0 10px;font-size:.92rem}
.count{font-size:1.5rem;color:var(--accent);font-weight:bold;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:16px}
.card{display:block;text-decoration:none;color:#fff;border-radius:12px;padding:28px 16px;text-align:center;border:2px solid transparent;transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card b{display:block;font-size:1.3rem;margin-top:6px}
.card small{opacity:.85}
.card .e{font-size:2.6rem}
.c1{background:linear-gradient(135deg,#2a1240,#ff8a1f)}
.c2{background:linear-gradient(135deg,#0a0d12,#7a5a1c)}
.c3{background:linear-gradient(135deg,#c8102e,#e34a5f)}
footer{background:var(--head);color:var(--headtext);text-align:center;padding:14px;font-size:.9rem;border-top:2px solid var(--accent)}
.sub{text-align:center}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1 id="ht"></h1><p id="hs"></p></header>
<div class="wrap" id="w"></div>
<footer id="ft">Stworzone przez numerek 7</footer>
<script>
var S={
halloween:{n:"Halloween",e:"🎃",m:9,d:31,
desc:"Halloween to wieczór pełen dyń, kostiumów i dreszczyku. Obchodzony 31 października, od wieków łączy dawne wierzenia z dzisiejszą zabawą. Najchętniej świętują je dzieci i młodzież, ale coraz częściej także dorośli, którzy urządzają tematyczne przyjęcia. Domy i ulice ozdabia się pajęczynami, szkieletami, nietoperzami i latarniami z dyni, a wieczorem w wielu miejscach odbywają się parady kostiumowe i maratony filmowe z horrorami. Święto jest najpopularniejsze w Stanach Zjednoczonych, Irlandii i Wielkiej Brytanii, ale w ostatnich latach zyskuje fanów także w Polsce.",c:"rekordowe dynie hodowlane ważą ponad tonę, a pierwsze latarnie robiono dawniej z rzepy.",l:[["Halloween – Wikipedia","https://pl.wikipedia.org/wiki/Halloween"],["Samhain – Wikipedia","https://pl.wikipedia.org/wiki/Samhain"],["Trick-or-treating (EN)","https://en.wikipedia.org/wiki/Trick-or-treating"]],
h:"Korzenie Halloween sięgają celtyckiego święta Samhain, które oznaczało koniec lata i początek zimy. Wierzono, że w tę noc granica między światem żywych i zmarłych staje się cienka. Z czasem tradycję przejęło chrześcijaństwo, a irlandzcy emigranci zawieźli ją do Stanów Zjednoczonych, skąd wróciła do świata w obecnej, popularnej formie.",
t:"Najbardziej znane zwyczaje to wydrążone dynie ze świecą w środku, przebieranie się za duchy, wiedźmy i potwory oraz zabawa „cukierek albo psikus”, czyli chodzenie od drzwi do drzwi po słodycze. W Polsce Halloween jest raczej imprezą i zabawą dla dzieci niż tradycyjnym świętem.",
i:["Data: 31 października","Dynie rzeźbiono dawniej z rzepy – dopiero w Ameryce zastąpiły je dynie.","Kolory święta: pomarańcz i czerń."]},
grobbing:{n:"Grobbing – Wszystkich Świętych",e:"🕯️",m:10,d:1,
desc:"Wszystkich Świętych to spokojny dzień wspomnień. 1 listopada Polacy odwiedzają groby bliskich i zapalają znicze. To czas zadumy i wspomnień, a nie zabawy. W wielu rodzinach jest też okazją do spotkania krewnych, którzy na co dzień mieszkają daleko od siebie. Przed świętem cmentarze są sprzątane, a przy bramach pojawiają się stoiska ze zniczami i kwiatami. Wiele osób odwiedza także groby opuszczone lub zasłużonych, by zapalić na nich światło.",c:"w nocy z 1 na 2 listopada na polskich cmentarzach płoną miliony zniczy, co widać nawet z dużej wysokości.",l:[["Wszystkich Świętych – Wikipedia","https://pl.wikipedia.org/wiki/Uroczysto%C5%9B%C4%87_Wszystkich_%C5%9Awi%C4%99tych"],["Zaduszki – Wikipedia","https://pl.wikipedia.org/wiki/Dzie%C5%84_Zaduszny"],["Cmentarz – Wikipedia","https://pl.wikipedia.org/wiki/Cmentarz"]],
h:"Uroczystość Wszystkich Świętych wywodzi się z chrześcijańskiego święta ku czci wszystkich świętych, obchodzonego na Zachodzie od wieków. Dzień później, 2 listopada, przypadają Zaduszki, czyli wspomnienie wszystkich wiernych zmarłych. W Polsce oba dni połączyły się w jedną tradycję odwiedzania cmentarzy.",
t:"Rodziny porządkują groby, układają kwiaty (najczęściej chryzantemy) i zapalają znicze. Wieczorem cmentarze rozświetlają tysiące płomyków, a ludzie spotykają się tam z rodziną i wspominają tych, którzy odeszli. To dzień wolny od pracy.",
i:["Data: 1 listopada (Zaduszki – 2 listopada)","Symbole: znicz i chryzantema.","Cmentarze wieczorem wyglądają jak morze światełek."]},
niepodleglosc:{n:"Święto Niepodległości",e:"🇵🇱",m:10,d:11,
desc:"11 listopada Polska świętuje odzyskanie niepodległości po 123 latach zaborów. To dzień flag, hymnu i biało-czerwonych barw. Odzyskanie niepodległości było możliwe dzięki upadkowi trzech zaborców jednocześnie oraz wysiłkowi wielu pokoleń Polaków, którzy przez cały XIX wiek walczyli o wolność powstaniami, a także pracą i kulturą. 11 listopada jest dniem wolnym od pracy, a flagę państwową wywiesza się na domach i budynkach w całym kraju. To święto przypomina, że wolność trzeba pielęgnować i pamiętać o tych, którzy o nią walczyli.",c:"przez 123 lata Polski nie było na mapach Europy, a mimo to język i kultura przetrwały.",l:[["Narodowe Święto Niepodległości – Wikipedia","https://pl.wikipedia.org/wiki/Narodowe_%C5%9Awi%C4%99to_Niepodleg%C5%82o%C5%9Bci"],["Józef Piłsudski – Wikipedia","https://pl.wikipedia.org/wiki/J%C3%B3zef_Pi%C5%82sudski"],["Mazurek Dąbrowskiego – Wikipedia","https://pl.wikipedia.org/wiki/Mazurek_D%C4%85browskiego"]],
h:"W 1795 roku Polska zniknęła z mapy Europy po trzecim rozbiorze. Dopiero w listopadzie 1918 roku, po zakończeniu I wojny światowej, państwo polskie odrodziło się. Józef Piłsudski wrócił do Warszawy 10 listopada, a 11 listopada przejął naczelne dowództwo wojska. Ustawowo święto państwowe przywrócono w 1989 roku.",
t:"Tego dnia wywiesza się flagi, odbywają się uroczystości państwowe, capstrzyki i wspólne śpiewanie pieśni patriotycznych. Wiele miast organizuje biegi niepodległości i parady, a w Warszawie odbywają się główne obchody przy Grobie Nieznanego Żołnierza.",
i:["Data: 11 listopada","Barwy: biel i czerwień.","Od 1918 roku minęło 108 lat."]}
};
var K=["halloween","grobbing","niepodleglosc"];
function days(s){var n=new Date(),t=new Date(n.getFullYear(),s.m,s.d),z=new Date(n.getFullYear(),n.getMonth(),n.getDate());
if(t<z)t=new Date(n.getFullYear()+1,s.m,s.d);var x=Math.round((t-z)/864e5);return x===0?"Dziś!":x===1?"Jutro!":"Za "+x+" dni"}
function r(){
var id=(location.hash||"#").slice(1)||"home",w=document.getElementById("w"),b=document.body;
var sec=id.split("-")[0],sub=id.split("-")[1];
if(!S[sec]){b.removeAttribute("data-t");document.title="Trzy święta";
document.getElementById("ft").textContent="Stworzone przez numerek 7";document.getElementById("ht").textContent="Trzy święta";document.getElementById("hs").textContent="Wybierz święto";
w.className="wrap home";
w.innerHTML='<main class="sub"><h2>Witaj!</h2><p>Wybierz jedno ze świąt, żeby zobaczyć opis, historię i tradycje.</p><div class="cards">'+
K.map(function(k,i){var s=S[k];return '<a class="card c'+(i+1)+'" href="#'+k+'"><span class="e">'+s.e+'</span><b>'+s.n+'</b><small>'+days(s)+'</small></a>'}).join("")+'</div></main>';return}
var s=S[sec];b.setAttribute("data-t",sec);document.title=s.n;
document.getElementById("ft").textContent="💡 Ciekawostka: "+s.c;document.getElementById("ht").textContent=s.e+" "+s.n;document.getElementById("hs").textContent=days(s);
w.className="wrap";
var pages=[["","Opis"],["historia","Historia"],["tradycje","Tradycje"]];
var nav='<nav><h3>Podstrony</h3><a href="#">← Strona główna</a>'+pages.map(function(p){var h=p[0]?sec+"-"+p[0]:sec;return '<a href="#'+h+'"'+((p[0]||"")===(sub||"")?' class="on"':'')+'>'+p[1]+'</a>'}).join("")+
'<hr><h3>Inne święta</h3>'+K.filter(function(k){return k!==sec}).map(function(k){return '<a href="#'+k+'">'+S[k].e+' '+S[k].n+'</a>'}).join("")+'</nav>';
var title=sub==="historia"?"Historia":sub==="tradycje"?"Tradycje":"O święcie";
var txt=sub==="historia"?s.h:sub==="tradycje"?s.t:s.desc;
var extra='';
w.innerHTML=nav+'<main><h2>'+title+'</h2><p>'+txt+'</p>'+extra+'</main>'+
'<aside><h3>Informacje</h3><p>Do święta:<span class="count">'+days(s)+'</span></p>'+s.i.map(function(x){return '<p>'+x+'</p>'}).join("")+'<h3 style="margin-top:14px">Warto przeczytać</h3>'+s.l.map(function(l){return '<p><a style="color:var(--accent)" target="_blank" rel="noopener" href="'+l[1]+'">'+l[0]+' ↗</a></p>'}).join("")+'</aside>';
}
window.addEventListener("hashchange",r);r();
</script>
</body>
</html>
